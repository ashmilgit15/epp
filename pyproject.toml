[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epp-lang"
description = "E++ — the English-like programming language with built-in GUI, canvas and animation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "E++ contributors" }]
keywords = ["programming-language", "interpreter", "beginner", "education", "gui", "english-like"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Beginners",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Interpreters",
]
requires-python = ">=3.10"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ashmilgit15/epp"
Repository = "https://github.com/ashmilgit15/epp"
Issues = "https://github.com/ashmilgit15/epp/issues"

[project.scripts]
epp = "interpreter.epp:main"

[tool.setuptools]
packages = ["interpreter"]

[tool.setuptools.dynamic]
version = { attr = "interpreter.__init__.__version__" }
