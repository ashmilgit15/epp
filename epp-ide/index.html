<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E++ IDE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #1e1e1e;
            color: #cccccc;
        }
        .app-container { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .toolbar {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #3c3c3c;
            gap: 8px;
        }
        .toolbar button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .toolbar button:hover { background-color: #1177bb; }
        .toolbar button.stop { background-color: #c42b1c; }
        .toolbar button.stop:hover { background-color: #e03e2e; }
        .toolbar button.guide { background-color: #2d8a4e; }
        .toolbar button.guide:hover { background-color: #36a05a; }
        .toolbar .title { font-size: 14px; font-weight: 600; margin-right: 20px; color: #ffffff; }
        .toolbar .spacer { flex: 1; }
        .toolbar .file-name { font-size: 12px; color: #888; }
        .main-content { display: flex; flex-direction: row; flex: 1; min-height: 0; min-width: 0; overflow: hidden; align-items: stretch; width: 100%; }
        .sidebar {
            width: 220px;
            min-width: 220px;
            flex-shrink: 0;
            background-color: #252526;
            border-right: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #bbbbbb;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }
        .sidebar-header button:hover { color: #fff; }
        .file-tree { flex: 1; overflow-y: auto; padding: 8px 0; }
        .file-item {
            display: flex;
            align-items: center;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 13px;
        }
        .file-item:hover { background-color: #2a2d2e; }
        .file-item.active { background-color: #37373d; }
        .file-item.directory { font-weight: 500; }
        .file-item .icon { margin-right: 8px; font-size: 14px; }
        .editor-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #editor { flex: 1; overflow: hidden; }
        .terminal {
            height: 150px;
            background-color: #1e1e1e;
            border-top: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
        }
        .terminal-header {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background-color: #252526;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #bbbbbb;
        }
        .terminal-header button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            margin-left: auto;
            padding: 2px 8px;
        }
        .terminal-header button:hover { color: #fff; }
        .terminal-output {
            flex: 1;
            padding: 12px 16px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 12px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .status-bar {
            display: flex;
            align-items: center;
            padding: 4px 16px;
            background-color: #007acc;
            font-size: 12px;
            color: white;
            gap: 16px;
        }
        .status-bar .status-item { display: flex; align-items: center; gap: 4px; }
        .status-bar .spacer { flex: 1; }
        .context-menu {
            position: fixed;
            background-color: #2d2d2d;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            padding: 4px 0;
            min-width: 160px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .context-menu-item { padding: 6px 16px; cursor: pointer; font-size: 12px; }
        .context-menu-item:hover { background-color: #0e639c; }
        .context-menu-separator { height: 1px; background-color: #3c3c3c; margin: 4px 0; }
        .hidden { display: none !important; }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #3c3c3c;
            border-radius: 8px 8px 0 0;
        }
        .modal-header h2 { font-size: 16px; color: #fff; }
        .modal-header button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 24px;
            margin-left: auto;
            padding: 0;
            line-height: 1;
        }
        .modal-header button:hover { color: #fff; }
        .modal-content {
            padding: 20px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }
        .modal-content h3 { color: #4fc3f7; margin-top: 16px; margin-bottom: 8px; font-size: 14px; }
        .modal-content h3:first-child { margin-top: 0; }
        .modal-content code {
            background: #2d2d2d;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 12px;
        }
        .modal-content pre {
            background: #2d2d2d;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 8px 0;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        .modal-content table { width: 100%; border-collapse: collapse; margin: 8px 0; }
        .modal-content th, .modal-content td { border: 1px solid #3c3c3c; padding: 8px 12px; text-align: left; }
        .modal-content th { background: #2d2d2d; }
        .modal-content ul { margin: 8px 0; padding-left: 24px; }
        .modal-content li { margin: 4px 0; }
        .ai-sidebar {
            width: 300px;
            min-width: 300px;
            max-width: 300px;
            flex-shrink: 0;
            background-color: #252526;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            color: #ccc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .ai-header {
            padding: 10px;
            background-color: #333;
            font-weight: bold;
            border-bottom: 1px solid #444;
        }
        .ai-messages {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
        }
        .ai-message {
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .ai-message.user {
            color: #4daafc;
        }
        .ai-message.assistant {
            color: #d4d4d4;
        }
        .ai-message pre {
            background-color: #1e1e1e;
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 5px 0;
            border: 1px solid #444;
            position: relative;
        }
        .ai-message code {
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .ai-apply-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background-color: #007acc;
            color: white;
            border: none;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 3px;
            cursor: pointer;
            opacity: 0.8;
        }
        .ai-apply-btn:hover {
            opacity: 1;
            background-color: #005f9e;
        }
        .ai-input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #333;
        }
        .ai-input {
            flex-grow: 1;
            background-color: #3c3c3c;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 3px;
            resize: none;
            height: 60px;
        }
        .ai-input:focus {
            outline: none;
            border-color: #007acc;
        }
        .ai-submit {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-left: 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        .ai-submit:hover {
            background-color: #005f9e;
        }
        .loader {
            border: 3px solid #333;
            border-top: 3px solid #007acc;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 5px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="toolbar">
            <span class="title">E++ IDE</span>
            <button id="new-file-btn">New File</button>
            <button id="open-file-btn">Open</button>
            <button id="save-btn">Save</button>
            <button id="save-as-btn">Save As</button>
            <button id="run-btn" class="run">Run (F5)</button>
            <button id="stop-btn" class="stop hidden">Stop</button>
            <button id="guide-btn" class="guide">Guide</button>
            <div class="spacer"></div>
            <span class="file-name" id="current-file">No file opened</span>
        </div>

        <div class="main-content">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <span>Explorer</span>
                    <button id="new-folder-btn" title="New Folder">+</button>
                </div>
                <div class="file-tree" id="file-tree"></div>
            </div>
            
            <div class="resizer" id="resizer"></div>

            <div class="editor-container" style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
                <div id="editor" style="flex: 1; min-height: 0;"></div>
                <div class="terminal" style="flex-shrink: 0;">
                    <div class="terminal-header">
                        <span>Output</span>
                        <button id="clear-terminal">Clear</button>
                    </div>
                    <div class="terminal-output" id="terminal-output"></div>
                </div>
            </div>
            
            <!-- AI Sidebar -->
            <div class="ai-sidebar">
                <div class="ai-header">E++ AI Agent</div>
                <div class="ai-messages" id="ai-messages">
                    <div class="ai-message assistant">Hello! I am your E++ AI coding assistant powered by Llama 3.1 70B (Nvidia API). How can I help you build production-level apps today?</div>
                </div>
                <div class="ai-input-container">
                    <textarea class="ai-input" id="ai-input" placeholder="Ask me to write e++ code or build an app..."></textarea>
                    <button class="ai-submit" id="ai-submit">Send</button>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-item" id="status-message">Ready</div>
            <div class="spacer"></div>
            <div class="status-item">E++</div>
            <div class="status-item" id="cursor-pos">Ln 1, Col 1</div>
        </div>
    </div>

    <div class="context-menu hidden" id="context-menu">
        <div class="context-menu-item" id="ctx-new-file">New File</div>
        <div class="context-menu-item" id="ctx-new-folder">New Folder</div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item" id="ctx-rename">Rename</div>
        <div class="context-menu-item" id="ctx-delete">Delete</div>
    </div>

    <div class="modal-overlay hidden" id="guide-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>E++ Getting Started Guide</h2>
                <button id="close-guide">&times;</button>
            </div>
            <div class="modal-content" id="guide-content"></div>
        </div>
    </div>

    <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
    <script>
        const GUIDE_CONTENT = `
<h3>Welcome to E++!</h3>
<p>E++ is the easiest programming language to learn. It uses English-like syntax.</p>

<h3>Creating a File</h3>
<ol>
<li>Click <strong>New File</strong> in the toolbar</li>
<li>Choose where to save the file</li>
<li>Enter a filename ending with <code>.epp</code></li>
<li>Start coding!</li>
</ol>

<h3>Basic Syntax</h3>
<h4>Variables</h4>
<pre>name = "Alice"
age = 25
pi = 3.14</pre>

<h4>Printing</h4>
<pre>say "Hello, World!"</pre>

<h4>Input</h4>
<pre>name = input("What is your name? ")
say "Hello, " + name</pre>

<h4>Conditionals</h4>
<pre>if x is greater than 10:
    say "big"
elif x is equal to 10:
    say "exact"
else:
    say "small"</pre>

<h4>Comparison Operators</h4>
<table>
<tr><th>English</th><th>Meaning</th></tr>
<tr><td><code>is</code></td><td>equal (==)</td></tr>
<tr><td><code>is not</code></td><td>not equal (!=)</td></tr>
<tr><td><code>is greater than</code></td><td>greater than (&gt;)</td></tr>
<tr><td><code>is less than</code></td><td>less than (&lt;)</td></tr>
</table>

<h4>Loops</h4>
<pre>for i in range(5):
    say i

while count is less than 10:
    count = count + 1</pre>

<h4>Functions</h4>
<pre>func add(a, b):
    return a + b

result = add(5, 3)</pre>

<h4>Classes</h4>
<pre>class Animal:
    func init(name):
        self.name = name
    func speak():
        say self.name + " speaks!"

dog = Animal("Rex")
dog.speak()</pre>

<h3>GUI (Desktop Apps)</h3>
<p>E++ makes it very easy to build desktop apps using built-in English keywords:</p>
<pre>window "My App" width 400 height 300

label "Enter your name:" at 20 20
input "name_box" at 20 50 width 200
button "Say Hello" at 20 90 on_click greet
label "" at 20 140 id "result"

func greet():
    name = get_text "name_box"
    set_text "result" to "Hello, " + name + "!"

show_window</pre>
<p>Other widgets include <code>image</code>, <code>textbox</code>, <code>checkbox</code>, <code>dropdown</code>, and functions like <code>alert</code>, <code>set_color</code>, <code>set_visible</code>.</p>

<h3>Keyboard Shortcuts</h3>
<ul>
<li><strong>Ctrl+S</strong> - Save file</li>
<li><strong>F5</strong> - Run program</li>
</ul>
`;

        const EPP_KEYWORDS = [
            'func', 'class', 'if', 'elif', 'else', 'for', 'while',
            'return', 'say', 'in', 'and', 'or', 'not', 'null',
            'true', 'false', 'self', 'import', 'try', 'catch',
            // GUI keywords
            'window', 'label', 'button', 'input', 'image', 'textbox',
            'checkbox', 'dropdown', 'options',
            'at', 'width', 'height', 'color', 'font_size', 'id',
            'on_click', 'on_change', 'placeholder', 'password', 'text',
            'set_text', 'to', 'get_text', 'show_window',
            'alert', 'set_color', 'set_visible', 'resizable'
        ];

        let editor;
        let currentFilePath = null;
        let currentProjectPath = null;
        let hasUnsavedChanges = false;

        require.config({ paths: { vs: 'node_modules/monaco-editor/min/vs' } });

        require(['vs/editor/editor.main'], function () {
            monaco.languages.register({ id: 'epp' });

            monaco.languages.setMonarchTokensProvider('epp', {
                keywords: EPP_KEYWORDS,
                operators: ['+', '-', '*', '/', '=', '<', '>', '!', '.'],
                symbols: /[=><!~?:&|+\-*\/\^%]+/,
                tokenizer: {
                    root: [
                        [/[a-z_]\w*/, { cases: { '@keywords': 'keyword', '@default': 'identifier' } }],
                        [/[A-Z]\w*/, 'type.identifier'],
                        [/\d+(\.\d+)?/, 'number'],
                        [/"([^"\\]|\\.)*$/, 'string.invalid'],
                        [/"/, { token: 'string.quote', bracket: '@open', next: '@string' }],
                        [/#.*$/, 'comment'],
                        [/[{}()\[\]]/, '@brackets'],
                        [/[<>](?!@symbols)/, '@brackets'],
                        [/@symbols/, { cases: { '@operators': 'operator', '@default': '' } }],
                        [/[;,.]/, 'delimiter']
                    ],
                    string: [
                        [/[^\\"]+/, 'string'],
                        [/\\./, 'string.escape'],
                        [/"/, { token: 'string.quote', bracket: '@close', next: '@pop' }]
                    ]
                }
            });

            monaco.languages.setLanguageConfiguration('epp', {
                comments: { lineComment: '#' },
                brackets: [['{', '}'], ['[', ']'], ['(', ')']],
                autoClosingPairs: [
                    { open: '{', close: '}' },
                    { open: '[', close: ']' },
                    { open: '(', close: ')' },
                    { open: '"', close: '"' }
                ],
                indentationRules: {
                    increaseIndentPattern: /^.*:\s*$/,
                    decreaseIndentPattern: /^\s*(elif|else|catch)\b/
                }
            });

            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '# Welcome to E++ IDE\n# Click "New File" or "Open" to start\n# Press F5 to run\n\nsay "Hello, World!"\n',
                language: 'epp',
                theme: 'vs-dark',
                fontSize: 14,
                fontFamily: "'Monaco', 'Menlo', 'Consolas', monospace",
                minimap: { enabled: true },
                automaticLayout: true,
                tabSize: 4,
                insertSpaces: true,
                wordWrap: 'on',
                lineNumbers: 'on',
                scrollBeyondLastLine: false
            });

            editor.onDidChangeModelContent(() => {
                hasUnsavedChanges = true;
                updateTitle();
            });

            editor.onDidChangeCursorPosition((e) => {
                document.getElementById('cursor-pos').textContent = `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
            });

            initializeApp();
        });

        async function initializeApp() {
            document.getElementById('guide-content').innerHTML = GUIDE_CONTENT;

            document.getElementById('new-file-btn').addEventListener('click', newFile);
            document.getElementById('open-file-btn').addEventListener('click', openFile);
            document.getElementById('save-btn').addEventListener('click', saveFile);
            document.getElementById('save-as-btn').addEventListener('click', saveAs);
            document.getElementById('new-folder-btn').addEventListener('click', newFolder);
            document.getElementById('run-btn').addEventListener('click', runFile);
            document.getElementById('stop-btn').addEventListener('click', stopRun);
            document.getElementById('clear-terminal').addEventListener('click', clearTerminal);
            document.getElementById('guide-btn').addEventListener('click', showGuide);
            document.getElementById('close-guide').addEventListener('click', hideGuide);
            document.getElementById('guide-modal').addEventListener('click', (e) => {
                if (e.target.id === 'guide-modal') hideGuide();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') hideGuide();
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    saveFile();
                } else if (e.key === 'F5') {
                    e.preventDefault();
                    runFile();
                }
            });

            document.getElementById('ctx-new-file').addEventListener('click', contextNewFile);
            document.getElementById('ctx-new-folder').addEventListener('click', contextNewFolder);
            document.getElementById('ctx-rename').addEventListener('click', contextRename);
            document.getElementById('ctx-delete').addEventListener('click', contextDelete);
            document.addEventListener('click', hideContextMenu);

            window.eppAPI.onRunOutput((data) => appendTerminal(data));
            window.eppAPI.onRunComplete((code) => {
                appendTerminal('\nProcess finished with exit code ' + code + '\n');
                showRunButton();
            });

            const homePath = await window.eppAPI.getHomePath();
            currentProjectPath = homePath;
            loadFileTree(homePath);
        }

        function showGuide() { document.getElementById('guide-modal').classList.remove('hidden'); }
        function hideGuide() { document.getElementById('guide-modal').classList.add('hidden'); }

        async function loadFileTree(dirPath) {
            currentProjectPath = dirPath;
            const result = await window.eppAPI.listFiles(dirPath);
            if (result.success) {
                renderFileTree(result.files);
                setStatus('Folder: ' + dirPath);
            } else {
                setStatus('Error: ' + result.error);
            }
        }

        async function renderFileTree(files) {
            const container = document.getElementById('file-tree');
            container.innerHTML = '';

            files.sort((a, b) => {
                if (a.isDirectory && !b.isDirectory) return -1;
                if (!a.isDirectory && b.isDirectory) return 1;
                return a.name.localeCompare(b.name);
            });

            if (currentProjectPath !== '/') {
                const parentItem = document.createElement('div');
                parentItem.className = 'file-item directory';
                parentItem.innerHTML = '<span class="icon">📁</span>..';
                parentItem.addEventListener('click', async () => {
                    const parent = await window.eppAPI.pathDirname(currentProjectPath);
                    loadFileTree(parent);
                });
                container.appendChild(parentItem);
            }

            files.forEach(file => {
                const item = document.createElement('div');
                item.className = 'file-item' + (file.isDirectory ? ' directory' : '');
                item.dataset.path = file.path;
                item.dataset.isDirectory = file.isDirectory;

                const icon = file.isDirectory ? '📁' : (file.name.endsWith('.epp') ? '📄' : '📝');
                item.innerHTML = '<span class="icon">' + icon + '</span>' + file.name;

                item.addEventListener('click', () => {
                    if (file.isDirectory) {
                        loadFileTree(file.path);
                    } else {
                        openExistingFile(file.path);
                    }
                });

                item.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showContextMenu(e, file);
                });

                container.appendChild(item);
            });
        }

        async function newFile() {
            const result = await window.eppAPI.showSaveDialog({
                title: 'New E++ File',
                defaultPath: currentProjectPath,
                filters: [{ name: 'E++ Files', extensions: ['epp'] }, { name: 'All Files', extensions: ['*'] }]
            });

            if (result.canceled || !result.filePath) return;

            const filePath = result.filePath;
            const content = editor.getValue();
            const writeResult = await window.eppAPI.writeFile(filePath, content);

            if (writeResult.success) {
                currentFilePath = filePath;
                hasUnsavedChanges = false;
                updateTitle();
                loadFileTree(await window.eppAPI.pathDirname(filePath));
                setStatus('File created: ' + filePath);
            } else {
                setStatus('Error: ' + writeResult.error);
            }
        }

        async function openFile() {
            const result = await window.eppAPI.showOpenDialog({
                title: 'Open File',
                defaultPath: currentProjectPath,
                filters: [{ name: 'E++ Files', extensions: ['epp'] }, { name: 'All Files', extensions: ['*'] }],
                properties: ['openFile']
            });

            if (result.canceled || result.filePaths.length === 0) return;
            openExistingFile(result.filePaths[0]);
        }

        async function openExistingFile(filePath) {
            if (hasUnsavedChanges && !confirm('You have unsaved changes. Continue?')) return;

            const result = await window.eppAPI.readFile(filePath);
            if (result.success) {
                editor.setValue(result.content);
                currentFilePath = filePath;
                hasUnsavedChanges = false;
                updateTitle();
                updateActiveFile(filePath);

                if (filePath.endsWith('.epp')) {
                    monaco.editor.setModelLanguage(editor.getModel(), 'epp');
                } else {
                    monaco.editor.setModelLanguage(editor.getModel(), 'plaintext');
                }
                setStatus('Opened: ' + filePath);
            } else {
                setStatus('Error: ' + result.error);
            }
        }

        function updateActiveFile(filePath) {
            document.querySelectorAll('.file-item').forEach(item => {
                item.classList.toggle('active', item.dataset.path === filePath);
            });
        }

        async function saveFile() {
            if (!currentFilePath) {
                await saveAs();
                return;
            }

            const content = editor.getValue();
            const result = await window.eppAPI.writeFile(currentFilePath, content);

            if (result.success) {
                hasUnsavedChanges = false;
                updateTitle();
                setStatus('Saved!');
            } else {
                setStatus('Error: ' + result.error);
            }
        }

        async function saveAs() {
            const result = await window.eppAPI.showSaveDialog({
                title: 'Save File',
                defaultPath: currentProjectPath,
                filters: [{ name: 'E++ Files', extensions: ['epp'] }, { name: 'All Files', extensions: ['*'] }]
            });

            if (result.canceled || !result.filePath) return;

            const filePath = result.filePath;
            const content = editor.getValue();
            const writeResult = await window.eppAPI.writeFile(filePath, content);

            if (writeResult.success) {
                currentFilePath = filePath;
                hasUnsavedChanges = false;
                updateTitle();
                loadFileTree(await window.eppAPI.pathDirname(filePath));
                setStatus('Saved!');
            } else {
                setStatus('Error: ' + writeResult.error);
            }
        }

        async function newFolder() {
            const name = prompt('Enter folder name:');
            if (!name) return;

            const folderPath = await window.eppAPI.pathJoin(currentProjectPath, name);
            const result = await window.eppAPI.createDirectory(folderPath);

            if (result.success) {
                loadFileTree(currentProjectPath);
                setStatus('Folder created!');
            } else {
                setStatus('Error: ' + result.error);
            }
        }

        async function runFile() {
            if (!currentFilePath) {
                setStatus('No file to run. Create or open a file first.');
                return;
            }

            if (!currentFilePath.endsWith('.epp')) {
                setStatus('Only .epp files can be run');
                return;
            }

            if (hasUnsavedChanges) {
                await saveFile();
            }

            clearTerminal();
            appendTerminal('Running: ' + currentFilePath + '\n\n');

            document.getElementById('run-btn').classList.add('hidden');
            document.getElementById('stop-btn').classList.remove('hidden');
            setStatus('Running...');

            const result = await window.eppAPI.runEpp(currentFilePath);
            if (!result.success) {
                appendTerminal('Error: ' + result.error + '\n');
                showRunButton();
            }
        }

        async function stopRun() {
            await window.eppAPI.stopRun();
            appendTerminal('\nProcess stopped\n');
            showRunButton();
        }

        function showRunButton() {
            document.getElementById('run-btn').classList.remove('hidden');
            document.getElementById('stop-btn').classList.add('hidden');
            setStatus('Ready');
        }

        function appendTerminal(text) {
            const terminal = document.getElementById('terminal-output');
            terminal.textContent += text;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('terminal-output').textContent = '';
        }

        async function updateTitle() {
            const fileName = currentFilePath ? currentFilePath.split(/[/\\]/).pop() : 'No file opened';
            const unsaved = hasUnsavedChanges ? ' •' : '';
            document.getElementById('current-file').textContent = fileName + unsaved;
        }

        function setStatus(message) {
            document.getElementById('status-message').textContent = message;
        }

        let contextTarget = null;

        function showContextMenu(e, file) {
            contextTarget = file;
            const menu = document.getElementById('context-menu');
            menu.style.left = e.clientX + 'px';
            menu.style.top = e.clientY + 'px';
            menu.classList.remove('hidden');

            document.getElementById('ctx-new-file').style.display = file.isDirectory ? 'block' : 'none';
            document.getElementById('ctx-new-folder').style.display = file.isDirectory ? 'block' : 'none';
        }

        function hideContextMenu() {
            document.getElementById('context-menu').classList.add('hidden');
        }

        async function contextNewFile() {
            if (!contextTarget || !contextTarget.isDirectory) return;

            const result = await window.eppAPI.showSaveDialog({
                title: 'New File',
                defaultPath: contextTarget.path,
                filters: [{ name: 'E++ Files', extensions: ['epp'] }, { name: 'All Files', extensions: ['*'] }]
            });

            if (result.canceled || !result.filePath) return;

            const writeResult = await window.eppAPI.writeFile(result.filePath, '');
            if (writeResult.success) {
                loadFileTree(currentProjectPath);
                setStatus('File created!');
            } else {
                setStatus('Error: ' + writeResult.error);
            }
        }

        async function contextNewFolder() {
            if (!contextTarget || !contextTarget.isDirectory) return;

            const name = prompt('Enter folder name:');
            if (!name) return;

            const folderPath = await window.eppAPI.pathJoin(contextTarget.path, name);
            const result = await window.eppAPI.createDirectory(folderPath);

            if (result.success) {
                loadFileTree(currentProjectPath);
                setStatus('Folder created!');
            } else {
                setStatus('Error: ' + result.error);
            }
        }

        async function contextRename() {
            if (!contextTarget) return;

            const newName = prompt('Enter new name:', contextTarget.name);
            if (!newName || newName === contextTarget.name) return;

            const parentDir = await window.eppAPI.pathDirname(contextTarget.path);
            const newPath = await window.eppAPI.pathJoin(parentDir, newName);
            const result = await window.eppAPI.renameFile(contextTarget.path, newPath);

            if (result.success) {
                loadFileTree(currentProjectPath);
                if (currentFilePath === contextTarget.path) {
                    currentFilePath = newPath;
                    updateTitle();
                }
                setStatus('Renamed!');
            } else {
                setStatus('Error: ' + result.error);
            }
        }

        async function contextDelete() {
            if (!contextTarget) return;
            if (!confirm('Delete "' + contextTarget.name + '"?')) return;

            const result = await window.eppAPI.deleteFile(contextTarget.path);

            if (result.success) {
                loadFileTree(currentProjectPath);
                if (currentFilePath === contextTarget.path) {
                    currentFilePath = null;
                    editor.setValue('# Welcome to E++ IDE\n\nsay "Hello!"\n');
                    updateTitle();
                }
                setStatus('Deleted!');
            } else {
                setStatus('Error: ' + result.error);
            }
        }

        // --- AI Chat Logic ---
        const aiMessagesDiv = document.getElementById('ai-messages');
        const aiInput = document.getElementById('ai-input');
        const aiSubmit = document.getElementById('ai-submit');
        let chatHistory = [];

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'ai-message ' + role;
            
            if (role === 'assistant') {
                // Simple markdown parsing for code blocks with Apply button
                const formattedText = text.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, '<div style="position:relative"><pre><code>$1</code></pre><button class="ai-apply-btn" onclick="applyCode(this)">Apply</button></div>')
                                        .replace(/`([^`]+)`/g, '<code>$1</code>')
                                        .replace(/\n/g, '<br>');
                msgDiv.innerHTML = '<strong>AI:</strong><br>' + formattedText;
            } else {
                msgDiv.innerHTML = '<strong>You:</strong><br>' + text.replace(/\n/g, '<br>');
            }
            
            aiMessagesDiv.appendChild(msgDiv);
            aiMessagesDiv.scrollTop = aiMessagesDiv.scrollHeight;
        }

        window.applyCode = function(btn) {
            const codeBlock = btn.parentElement.querySelector('code');
            if (codeBlock && editor) {
                // Replace encoded HTML entities
                const code = codeBlock.innerHTML
                    .replace(/&lt;/g, '<')
                    .replace(/&gt;/g, '>')
                    .replace(/&amp;/g, '&')
                    .replace(/<br>/gi, '\n');
                
                editor.executeEdits("ai-agent", [{
                    range: editor.getModel().getFullModelRange(),
                    text: code,
                    forceMoveMarkers: true
                }]);
                
                btn.innerHTML = "Applied ✓";
                btn.style.backgroundColor = "#2d8a4e";
                setTimeout(() => {
                    btn.innerHTML = "Apply";
                    btn.style.backgroundColor = "#007acc";
                }, 2000);
            }
        };

        let currentAssistantMsgDiv = null;
        let currentFullText = "";

        window.eppAPI.onAiStreamChunk((chunk) => {
            if (!currentAssistantMsgDiv) {
                currentAssistantMsgDiv = document.createElement('div');
                currentAssistantMsgDiv.className = 'ai-message assistant';
                aiMessagesDiv.appendChild(currentAssistantMsgDiv);
            }
            currentFullText += chunk;
            
            // Auto-type code into the editor if we are inside a code block
            const blocks = currentFullText.split(/```[a-zA-Z]*\n?/);
            if (blocks.length % 2 === 0) {
                const currentCode = blocks[blocks.length - 1];
                if (editor) {
                    const scrollPos = editor.getScrollTop();
                    editor.executeEdits("ai-agent", [{
                        range: editor.getModel().getFullModelRange(),
                        text: currentCode,
                        forceMoveMarkers: true
                    }]);
                    editor.setScrollTop(scrollPos);
                }
            }
            
            const formattedText = currentFullText.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, '<div style="position:relative"><pre><code>$1</code></pre><button class="ai-apply-btn" onclick="applyCode(this)">Apply</button></div>')
                                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                                    .replace(/\n/g, '<br>');
            currentAssistantMsgDiv.innerHTML = '<strong>AI:</strong><br>' + formattedText;
            aiMessagesDiv.scrollTop = aiMessagesDiv.scrollHeight;
        });

        async function sendAiMessage() {
            const text = aiInput.value.trim();
            if (!text) return;

            aiInput.value = '';
            aiInput.disabled = true;
            aiSubmit.disabled = true;
            aiSubmit.innerHTML = 'Wait<div class="loader"></div>';

            appendMessage('user', text);
            chatHistory.push({ role: 'user', content: text });

            currentAssistantMsgDiv = null;
            currentFullText = "";

            try {
                const response = await window.eppAPI.chatWithAI(chatHistory);
                if (response.success) {
                    chatHistory.push({ role: 'assistant', content: response.reply });
                } else {
                    appendMessage('assistant', 'Error connecting to AI: ' + response.error);
                }
            } catch (err) {
                appendMessage('assistant', 'System error: ' + err.message);
            }

            aiInput.disabled = false;
            aiSubmit.disabled = false;
            aiSubmit.innerHTML = 'Send';
            aiInput.focus();
        }

        aiSubmit.addEventListener('click', sendAiMessage);
        aiInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendAiMessage();
            }
        });

    </script>
</body>
</html>
